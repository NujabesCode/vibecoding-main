# /etc/nginx/sites-available/campus
# 화면(React 빌드 파일)은 Nginx가 직접 주고, /api 와 /ws 는 스프링(8080)으로 넘긴다.
# HTTPS 설정(443)은 certbot --nginx 가 이 파일에 자동으로 추가해 준다.
server {
    listen 80;
    server_name YOUR_DOMAIN.duckdns.org;

    root /opt/campus/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # WebSocket: Upgrade 헤더를 넘겨야 연결된다. 오래 열려 있으니 타임아웃을 길게.
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
